<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cinnamon store ♡</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#fff8f7;
  color:#654f4c;
}

.container{
  width:min(100%,500px);
  margin:auto;
  padding:15px;
}

/* หัวเว็บ */
.header{
  background:linear-gradient(135deg,#ffe1dc,#fff1c9,#e5f5df);
  border-radius:30px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 8px 25px #d9b8b333;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  background:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 5px 15px #00000012;
}

.header h1{
  margin:15px 0 5px;
  font-size:30px;
}

.header p{
  margin:0;
  color:#987875;
}

/* ปุ่มเมนู */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:18px;
}

.card{
  border:0;
  border-radius:25px;
  padding:23px 10px;
  background:white;
  box-shadow:0 7px 20px #d9b8b322;
  color:#654f4c;
  cursor:pointer;
}

.card:active{
  transform:scale(.97);
}

.icon{
  width:62px;
  height:62px;
  margin:auto;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin-bottom:10px;
}

.pink{background:#ffdcd8}
.green{background:#dff2df}
.yellow{background:#fff0b9}
.purple{background:#eadfff}

.card b{
  display:block;
  font-size:17px;
}

.card small{
  color:#a0837e;
}
if(type==="สินค้า"){
content.innerHTML=`
<div class="product">
<h3>🔥 Free Fire</h3>
<p>เติมเกม Free Fire</p>
<button class="add">เลือกแพ็กเติม</button>
</div>

<div class="product">
<h3>⚔️ RoV</h3>
<p>เติมเกม RoV</p>
<button class="add">เลือกแพ็กเติม</button>
</div>
`;
}
.section h2{
  margin-top:0;
}

.product{
  background:#fff7f5;
  border-radius:18px;
  padding:14px;
  margin-top:10px;
}

.product b{
  font-size:16px;
}

.price{
  color:#e68b82;
  font-weight:bold;
}

/* รีวิว */
.review-box input,
.review-box textarea{
  width:100%;
  border:1px solid #ead7d3;
  border-radius:14px;
  padding:12px;
  margin-top:8px;
  font:inherit;
}

.review-box textarea{
  min-height:80px;
  resize:none;
}

.add{
  width:100%;
  border:0;
  background:#ffd3ce;
  color:#654f4c;
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
}

.review{
  background:#fff7f5;
  border-radius:16px;
  padding:13px;
  margin-top:10px;
}

.like{
  float:right;
  border:0;
  border-radius:20px;
  padding:6px 10px;
  background:#fff0b9;
  cursor:pointer;
}

/* หน้าต่าง */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#00000055;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:420px;
  border-radius:25px;
  padding:22px;
}

.close{
  float:right;
  border:0;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#ffe2de;
  cursor:pointer;
}

.footer{
  text-align:center;
  padding:25px;
  color:#a28782;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="logo">🍓</div>
    <h1>cinnamon</h1>
    <p>ร้านเติมเกม • ขายไอดี ♡</p>
  </header>

  <div class="menu">

    <button class="card" onclick="showModal('สินค้า')">
      <div class="icon pink">🛍️</div>
      <b>All Product</b>
      <small>สินค้าทั้งหมด</small>
    </button>

    <button class="card" onclick="showModal('ติดต่อ')">
      <div class="icon green">💌</div>
      <b>Contact</b>
      <small>ติดต่อร้าน</small>
    </button>

    <button class="card" onclick="goReview()">
      <div class="icon yellow">⭐</div>
      <b>Review ♡</b>
      <small>รีวิว +1</small>
    </button>

    <button class="card" onclick="showModal('ชำระเงิน')">
      <div class="icon purple">💳</div>
      <b>Payment ♡</b>
      <small>ช่องทางชำระเงิน</small>
    </button>

  </div>

  <section class="section">
    <h2>🛍️ สินค้าแนะนำ</h2>

    <div class="product">
      <b>เติมเกม</b><br>
      <span>บริการเติมเกมต่าง ๆ</span><br>
      <span class="price">เริ่มต้น xx บาท</span>
    </div>

    <div class="product">
      <b>ขายไอดีเกม</b><br>
      <span>ไอดีเกมพร้อมใช้งาน</span><br>
      <span class="price">สอบถามราคา</span>
    </div>

  </section>

  <section class="section review-box" id="reviews">

    <h2>💬 รีวิวจากลูกค้า</h2>

    <input id="name" placeholder="ชื่อของคุณ">

    <textarea id="message"
      placeholder="เขียนรีวิว หรือกด +1 ให้ร้านก็ได้"></textarea>

    <button class="add" onclick="addReview()">
      ＋ เพิ่มรีวิว
    </button>

    <div id="reviewList"></div>

  </section>

  <div class="footer">
    cinnamon store ♡<br>
    ขอบคุณที่อุดหนุนร้านของเรา
  </div>

</div>


<!-- หน้าต่างข้อมูล -->

<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <h2 id="modalTitle"></h2>

    <div id="modalContent"></div>

  </div>

</div>


<script>

function showModal(type){

  const modal=document.getElementById("modal");
  const title=document.getElementById("modalTitle");
  const content=document.getElementById("modalContent");

  title.innerText=type;

  if(type==="สินค้า"){

    content.innerHTML=`
      <div class="product">
        🛍️ เติมเกม<br>
        <b>เริ่มต้น xx บาท</b>
      </div>

      <div class="product">
        🎮 ขายไอดีเกม<br>
        <b>สอบถามราคาได้เลย</b>
      </div>
    `;

  }

  if(type==="ติดต่อ"){

    content.innerHTML=`
      <div class="product">
        💙 Facebook<br>
        <b>ใส่ลิงก์ Facebook ร้านตรงนี้</b>
      </div>

      <div class="product">
        💚 LINE<br>
        <b>@473hgwgb</b>
      </div>
    `;

  }

  if(type==="ชำระเงิน"){

    content.innerHTML=`
      <div class="product">
        💳 ช่องทางชำระเงิน
        <br><br>
        ธนาคาร : ใส่ชื่อธนาคาร<br>
        เลขบัญชี : ใส่เลขบัญชี<br>
        ชื่อบัญชี : พิเชษฐ์ พร้อมเสมอ
      </div>
    `;

  }

  modal.classList.add("show");
}


function closeModal(){

  document.getElementById("modal").classList.remove("show");

}


function goReview(){

  document.getElementById("reviews").scrollIntoView({
    behavior:"smooth"
  });

}


function addReview(){

  const name=
    document.getElementById("name").value.trim()
    || "ลูกค้า";

  const message=
    document.getElementById("message").value.trim();

  const review=
    document.createElement("div");

  review.className="review";

  review.innerHTML=`
    <button class="like" onclick="plusOne(this)">
      +1
    </button>

    <b>${escapeHTML(name)}</b>

    <p>
      ${message
        ? escapeHTML(message)
        : "กด +1 ให้ร้าน ♡"}
    </p>
  `;

  document
    .getElementById("reviewList")
    .prepend(review);

  document.getElementById("name").value="";
  document.getElementById("message").value="";

}


function plusOne(button){

  let number=
    Number(button.dataset.count || 1);

  number++;

  button.dataset.count=number;

  button.innerText="♡ "+number;

}


function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
